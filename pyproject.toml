[project]
name = "oplogica-comfyui"
version = "1.1.0"
description = "Open-source ComfyUI node pack for approval-bound decision records: strict task, evidence, output, and workflow-structure binding, sealed hash-chained decision records, portable decision passports with a standalone verifier, HMAC verification, and decision cards."
license = { file = "LICENSE" }
requires-python = ">=3.9"
dependencies = ["Pillow>=9.0", "numpy>=1.23"]

[tool.comfy]
DisplayName = "Oplogica Decision Records"
